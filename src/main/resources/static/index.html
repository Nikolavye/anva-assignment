<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANVA Word Frequency Analyzer</title>
    <!-- Modern Font from Google -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- Background Decoration -->
    <div class="bg-blur shape-1"></div>
    <div class="bg-blur shape-2"></div>
    <div class="bg-blur shape-3"></div>

    <div class="container">

        <header>
            <h1><i data-lucide="activity"></i> Word Frequency <span>Analyzer</span></h1>
            <p>A smart microservice to analyze text patterns.</p>
        </header>

        <main>
            <!-- Input Section -->
            <section class="glass-panel input-section">
                <h2>Analyze Text</h2>

                <div class="form-group">
                    <label for="textInput">Enter your text:</label>
                    <textarea id="textInput" placeholder="Paste or type text here..."></textarea>
                </div>

                <div class="operation-tabs">
                    <button class="tab active" data-op="highest">Highest Frequency</button>
                    <button class="tab" data-op="specific">Specific Word</button>
                    <button class="tab" data-op="top-n">Top N Words</button>
                </div>

                <!-- Contextual Inputs -->
                <div id="specificWordInput" class="form-group slide-in hidden">
                    <label for="wordInput">Target Word:</label>
                    <input type="text" id="wordInput" placeholder="e.g., hello">
                </div>

                <div id="topNInput" class="form-group slide-in hidden">
                    <label for="nInput">Number of words (N):</label>
                    <input type="number" id="nInput" value="3" min="1">
                </div>

                <button id="analyzeBtn" class="btn-primary">
                    <i data-lucide="zap"></i> Run Analysis
                </button>
            </section>

            <!-- Results Section -->
            <section id="resultSection" class="glass-panel result-section hidden">
                <div class="result-header">
                    <h2><i data-lucide="check-circle-2"></i> Result</h2>
                    <span id="operationLabel" class="badge"></span>
                </div>

                <div id="singleResultBox" class="result-box hidden">
                    <div id="singleResultWordBox" class="hidden" style="margin-bottom: 10px; font-size: 1.2rem;">
                        Top Word: <strong id="singleResultWord" style="color: var(--primary);"></strong>
                    </div>
                    <span class="result-label">The count is:</span>
                    <span id="singleResultValue" class="result-number">0</span>
                </div>

                <div id="listResultBox" class="result-box hidden">
                    <ul id="resultList" class="word-list">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </section>

            <!-- History Section -->
            <section class="glass-panel history-section">
                <div class="history-header">
                    <h2><i data-lucide="history"></i> Analysis History</h2>
                    <div style="display: flex; gap: 8px;">
                        <button type="button" id="deleteAllHistoryBtn" class="icon-btn" title="Delete All"
                            style="color: #ff4d4f;"><i data-lucide="trash-2"></i></button>
                        <button type="button" id="refreshHistoryBtn" class="icon-btn" title="Refresh"><i
                                data-lucide="refresh-cw"></i></button>
                    </div>
                </div>

                <div class="history-container">
                    <ul id="historyList" class="history-list">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>

</html>
